<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Brilhy - Aniversário</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="sparkles">
    <span class="sparkle" style="top: 10%; left: 15%;">✨</span>
    <span class="sparkle" style="top: 25%; right: 10%;">💖</span>
    <span class="sparkle" style="top: 50%; left: 5%;">⭐</span>
    <span class="sparkle" style="top: 75%; right: 15%;">✨</span>
    <span class="sparkle" style="top: 85%; left: 20%;">🎀</span>
  </div>

  <main class="card">
    <header class="header">
      <img src="logo.png" alt="Pedro Brilhy" class="logo-img">
      <p class="subtitle">Sem bolo, sem parabéns... só bons drinks, comidas incríveis e meus melhores amigos reunidos no pub! 🍸💖</p>
    </header>

    <!-- Contador com Fundo Azul -->
    <section class="countdown-section">
      <p class="section-label">💖 CONTAGEM REGRESSIVA 💖</p>
      <div id="countdown" class="countdown-grid">
        <div class="time-box"><span id="days">00</span><label>dias</label></div>
        <div class="time-box"><span id="hours">00</span><label>horas</label></div>
        <div class="time-box"><span id="minutes">00</span><label>min</label></div>
        <div class="time-box"><span id="seconds">00</span><label>seg</label></div>
      </div>
    </section>

    <!-- Detalhes em Rosa Claro -->
    <section class="details-section">
      <div class="detail-item">
        <span class="icon">📅</span>
        <div>
          <strong>QUANDO?</strong>
          <p>01 de Outubro de 2026 às 19h</p>
        </div>
      </div>

      <div class="detail-item">
        <span class="icon">🍸</span>
        <div>
          <strong>ONDE?</strong>
          <p>Paralelo Pub</p>
        </div>
      </div>
    </section>

    <footer class="actions">
      <a href="https://wa.me/5500000000000?text=Com%20certeza%20estarei%20l%C3%A1%20para%20brindar!" target="_blank" class="btn btn-primary">
        CONFIRMAR PRESENÇA 💌
      </a>
      <a href="https://www.google.com/maps/search/?api=1&query=Paralelo+Pub" target="_blank" class="btn btn-secondary">
        VER LOCAL NO MAPA 📍
      </a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
